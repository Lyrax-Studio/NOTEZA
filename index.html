<!DOCTYPE html>
<html lang="en">

<head>
    <!-- How the page is read on phones and in the tab -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOTEZA Studio is a student workspace for notes, presentations and UI practice.">
    <title>NOTEZA Studio — notes, presentations and UI</title>
    <link rel="icon" href="./images/favicon.png">
    <!-- Google Seo by meta support -->
    <meta name="google-site-verification" content="85OHfIqyx2X6guSTtSIn383ta-MYqoa6ZCYRQ4DA_4k" />

    <!-- Order matters: variables first, then sidebar, then Home age layout -->
    <link id="theme" rel="stylesheet" href="./css/cssVariables.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/home.css">
</head>

<body>
    <aside id="notePanel" class="notePanel">
        <header class="notePanelTop">
            <a class="back" href="index.html"><button type="button" id="back">← Back</button></a>
            <h1 id="heading"></h1>
        </header>
        <div id="noteOutput" class="noteOutput"></div>
    </aside>

    <!-- Fixed blue bar on the left -->
    <div class="navContainer">

        <nav>
            <div class="logoContainer">
                <img class="logo" src="./images/logo.svg" alt="NOTEZA">
            </div>

            <!-- JS adds class="active" on Home -->
            <div class="linkContainer">
                <a id="homeLink" href="./index.html">Home</a>
                <a id="workLink" href="./work.html">Work</a>
                <a id="libraryLink" href="./library.html">Library</a>
                <a id="settingLink" href="./setting.html">Settings</a>
            </div>
        </nav>

    </div>


    <!--
        3 grid cells:
        helloCard | storageCard
        recentCard (full width)
    -->
    <main>
        <section class="helloCard">
            <!-- home.js writes: Hi, Name -->
            <h1 id="usernameOutput"></h1>
            <p class="helloSub">Notes, presentations and UI</p>
        </section>

        <aside class="storageCard">
            <p class="storageTitle">Storage left</p>
            <!-- Inner span width = how full the bar looks (now 88%) -->
            <div class="storageBar">
                <span class="storageFill"></span>
            </div>
            <p class="storageText">100% left</p>
        </aside>

        <section class="recentCard">
            <p class="recentLabel">Recently edited</p>
            <!-- Later JS will replace this li with real notes -->
            <div id="recentList"></div>
        </section>
    </main>

    <script src="./js/home.js"></script>
</body>

</html>
