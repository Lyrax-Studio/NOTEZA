<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOTEZA Studio library — folders and notes">
    <title>NOTEZA Studio | Library</title>
    <link rel="icon" href="./images/favicon.png">
    <link id="theme" rel="stylesheet" href="./css/cssVariables.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/library.css">
</head>

<body>
    <div class="navContainer">
        <nav>
            <div class="logoContainer">
                <img class="logo" src="./images/logo.svg" alt="NOTEZA">
            </div>
            <div class="linkContainer">
                <a id="homeLink" href="./index.html">Home</a>
                <a id="workLink" href="./work.html">Work</a>
                <a id="libraryLink" href="./library.html">Library</a>
                <a id="settingLink" href="./setting.html">Settings</a>
            </div>
        </nav>
    </div>

    <div class="libraryPage">
        <header class="libraryHead">
            <h1>Library</h1>
        </header>
        <main id="folderContainer"></main>
    </div>

    <aside id="notePanel" class="notePanel">
        <header class="notePanelTop">
            <button type="button" id="closeNote">← Back</button>
            <h1 id="heading"></h1>
        </header>
        <div id="noteOutput" class="noteOutput"></div>
    </aside>

    <script src="./js/library.js"></script>
</body>

</html>
